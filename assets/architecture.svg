<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">IncidentOps Copilot architecture</title><desc id="desc">Architecture showing alerts entering the triage core, Hindsight memory and LLM reasoning, followed by evidence, human approval and continuous learning.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#05090c"/><stop offset="1" stop-color="#08151a"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#16f2a5"/><stop offset="1" stop-color="#27c8ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1400" height="760" rx="28" fill="url(#bg)"/>
<g font-family="Inter,Arial,sans-serif" fill="#e8f0f2">
<text x="70" y="78" font-size="18" letter-spacing="4" fill="#7ee7c0">INCIDENTOPS COPILOT / ARCHITECTURE</text>
<text x="70" y="118" font-size="38" font-weight="700">From alert to reusable operational memory</text>
<text x="70" y="150" font-size="16" fill="#91a4aa">A human-gated learning loop built around Hindsight memory.</text>
</g>
<g stroke="#22343a" fill="#0b1317">
<rect x="70" y="250" width="220" height="130" rx="18"/><rect x="350" y="250" width="220" height="130" rx="18"/>
