<rect x="950" y="470" width="220" height="110" rx="18"/><rect x="630" y="590" width="260" height="100" rx="18"/>
</g>
<g font-family="Inter,Arial,sans-serif">
<g fill="#e8f0f2" font-size="18" font-weight="700">
<text x="95" y="292">Operational alerts</text><text x="375" y="292">Triage core</text>
<text x="665" y="222">Hindsight memory</text><text x="665" y="412">LLM reasoning</text>
<text x="975" y="292">Trusted evidence</text><text x="1235" y="292">SRE</text>
<text x="975" y="512">Runbook gate</text><text x="665" y="632">Retain + learn</text>
</g>
<g fill="#8da2a9" font-size="14">
<text x="95" y="322">Prometheus / webhook / UI</text><text x="375" y="322">normalize + orchestrate</text>
<text x="665" y="252">recall · reflect · retain</text><text x="665" y="442">diagnosis + rationale</text>
<text x="975" y="322">relevance + provenance</text><text x="1235" y="322">approval</text>
<text x="975" y="542">recommend · simulate</text><text x="665" y="662">postmortem → future recall</text>
</g></g>
