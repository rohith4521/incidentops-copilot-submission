name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Type Check, Scan & Pytest Suite
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      HOST: 127.0.0.1
      PORT: 8000
      LOG_LEVEL: INFO
      HINDSIGHT_API_URL: http://127.0.0.1:8888
      HINDSIGHT_BANK_ID: sre-incidentops-production
      GROQ_MODEL: llama-3.3-70b-versatile
      FALLBACK_LLM_PROVIDER: mock
      AUTH_JWT_SECRET: incidentops-sre-verified-jwt-secret-key-prod-2026
      AUTH_SRE_API_KEYS: "sre-key-alice:lead-sre-alice,sre-key-oncall:oncall-sre,sre-key-admin:admin-sre"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Quality Gate Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: Ruff Lint Quality Gate
        run: |
          ruff check app/

      - name: Mypy Type Check Gate
        run: |
          mypy app/

      - name: Dependency Vulnerability Scan Gate
        run: |
          pip-audit -r requirements.txt

      - name: Run Complete Test Suite
        run: |
          pytest -v

  docker-build:
    name: Validate Docker Container Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image (No Registry Push)
        run: |
          docker build -t incidentops-copilot:ci .
