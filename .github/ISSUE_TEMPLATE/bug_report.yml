name: Bug report
description: Report a reproducible defect in IncidentOps Copilot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reproducible sequence, scenario, or command.
      placeholder: |
        1. Start the application...
        2. Trigger scenario...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, test output, screenshots, or trace details. Remove secrets first.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend
        - Frontend
        - Hindsight memory
        - Runbook approval
        - Security
        - Evaluation
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed API keys, credentials, tokens, and private incident data.
          required: true
